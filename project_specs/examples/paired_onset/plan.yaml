schema: dcalc.paired_onset.plan.v1
# Supply an ordinary static DESIGN and ITS saved passive realization.
# These relative model paths are placeholders for previously saved fits, not fits run here.
cases:
  - id: cylinder
    config: ../design_pitch/config.yaml
    design: ../design_pitch/cylinder.json
    model_in: saved-cylinder/model.json
    recipe: &recipe
      sample_rate_hz: 12000
      h_cm: 0.5
      loss_model: zk
      radiation_model: legacy
      air_reference: ck_dry20
      R0: null
      dc_origin: null
      basis_completion: r29
      fit_min_hz: 40.0
      fit_max_hz: 3000.0
      fit_points: 4096
      guard_max_hz: 3500.0
      guard_points: 768
      audit_points: 1536
  - id: exponential
    config: ../design_pitch/config.yaml
    design: ../design_pitch/exponential.yaml
    model_in: saved-exponential/model.json
    recipe: *recipe
reference_lips:
  mouth_pressure_kpa: 1.5
  resonance_hz: 80.0
  effective_area_m2: 0.000003
  mass_kg: 0.0001
  rest_opening_m: 0.0008
  lip_width_m: 0.012
  damping_ratio: 0.20
  contact_stiffness_n_per_m: 10000.0
  contact_damping_n_s_per_m: 0.04
  min_opening_m: 0.000001
  flow_coefficient: 0.72
  pressure_force_sign: -1.0
# Numerical sensitivity choices, not physiological presets or calibrated intervals.
scenarios:
  - id: central
    changes: {}
  - id: resonance70
    changes: {resonance_hz: 70.0}
rho_kg_m3: 1.2046925976462561
source: ideal
port_model: conjugate
pressure_grid:
  fractions: [0.02, 0.08, 0.16, 0.28, 0.42, 0.58, 0.74, 0.90, 0.98]
windows:
  - id: low_mode
    pressure_pa: [1000.0, 4000.0]
    frequency_hz: [40.0, 150.0]
# [] is a valid descriptive comparison. Example requirements are documented separately.
criteria: []
budgets:
  refinements: 23
  evaluations_per_unit: 64
  total_evaluations: 256
  child_seconds: 180
  orchestrator_seconds: 600
  memory_mib: 768
  blas_threads: 1
  output_mib: 100
# No TMM unless the complete optional control is explicitly declared.
tmm: null
